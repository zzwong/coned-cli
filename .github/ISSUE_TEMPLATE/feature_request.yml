name: Feature request
description: Propose a read-only workflow or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include account information or captured provider responses.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Include example commands and safe output shapes when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request does not contain credentials, identifiers, addresses, bills, or raw provider data.
          required: true
